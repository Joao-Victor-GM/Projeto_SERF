<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso - SERF</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="fivecon.png">
  </head>
  <body>
    <div id="particles-js"></div>
    <div class="container" id="container">
      
      <!-- TELA DE CADASTRO (Fica escondida à esquerda inicialmente) -->
      <div class="form-container sign-up-container">
        <!-- ALTERADO: Tiramos o 'action' e adicionamos id="formCadastro" para o JS achar o formulário -->
        <form id="formCadastro">
          <img src="serflogo.png" alt="Logo SERF" class="logo" />
          <h2>Criar Conta</h2>

          <!-- Escolha B2B -->
          <div class="perfil-opcoes">
            <label class="perfil-card">
              <!-- ALTERADO: Adicionado value="Comprador" para o banco saber a escolha -->
              <input type="radio" name="perfil" value="Comprador" checked />
              <span>Comprar(Microempresa)</span>
            </label>
            <label class="perfil-card">
              <!-- ALTERADO: Adicionado value="Fornecedor" para o banco saber a escolha -->
              <input type="radio" name="perfil" value="Fornecedor" />
              <span>Vender(Fornecedor)</span>
            </label>
          </div>

          <!-- ALTERADO: Adicionados IDs em cada um dos inputs abaixo -->
          <input type="text" id="cnpjCadastro" placeholder="CNPJ" required />
          <input type="text" id="razaoSocialCadastro" placeholder="Razão Social" required />
          <input type="email" id="emailCadastro" placeholder="E-mail" required />
          <input type="password" id="senhaCadastro" placeholder="Senha" required />

          <button type="submit" class="btn-solid">Cadastrar</button>
        </form>
      </div>

      <!-- TELA DE LOGIN (Fica visível à direita inicialmente) -->
      <div class="form-container sign-in-container">
        <!-- ALTERADO: Adicionado id="formLogin" -->
        <form id="formLogin">
          <img src="serflogo.png" alt="Logo SERF" class="logo" />
          <h2>Acesse sua conta</h2>
          <span class="subtitle">Insira seus dados para continuar.</span>

          <!-- ALTERADO: Adicionados IDs nos inputs de login -->
          <input type="text" id="cnpjLogin" placeholder="CNPJ" required />
          <input type="password" id="senhaLogin" placeholder="Senha" required />

          <a href="#" class="forgot-pass">Esqueceu a senha?</a>
          <button type="submit" class="btn-solid">Entrar</button>
        </form>
      </div>

      <!-- PAINEL DESLIZANTE (A parte colorida que faz a animação) -->
      <div class="overlay-container">
        <div class="overlay">
          <!-- Conteúdo do painel quando está na esquerda -->
          <div class="overlay-panel overlay-left">
            <h2>Já é membro?</h2>
            <p>
              Faça login para continuar de onde parou e acessar a cadeia de
              suprimentos.
            </p>
            <button class="btn-ghost" id="signIn">Fazer Login</button>
          </div>

          <!-- Conteúdo do painel quando está na direita -->
          <div class="overlay-panel overlay-right">
            <h2>Novo por aqui?</h2>
            <p>
              Crie sua conta em poucos segundos e desbloqueie toda a experiência
              B2B.
            </p>
            <button class="btn-ghost" id="signUp">Criar Conta</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ALTERADO: Importamos o script do Supabase. Ele DEVE vir antes de qualquer outro script! -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SCRIPT DA ANIMAÇÃO (Mantivemos exatamente como você fez) -->
    <script>
      const signUpButton = document.getElementById("signUp");
      const signInButton = document.getElementById("signIn");
      const container = document.getElementById("container");

      // Quando clica em "Criar Conta", adiciona a classe que move tudo para a esquerda
      signUpButton.addEventListener("click", () => {
        container.classList.add("right-panel-active");
      });

      // Quando clica em "Fazer Login", remove a classe e volta para o padrão
      signInButton.addEventListener("click", () => {
        container.classList.remove("right-panel-active");
      });
    </script>

       <!-- Biblioteca oficial Particles.js -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    
    <!-- Seu arquivo app-v2.js e a inicialização -->
    <script src="app-v2.js"></script>
    <script src="particles-config.js"></script>


  </body>
</html>
