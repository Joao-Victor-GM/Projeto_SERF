<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Política de segurança (CSP): ver frontend/_headers e docs/seguranca.md -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://challenges.cloudflare.com; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://rparlqdgcwzoanpqqeof.supabase.co; connect-src 'self' https://rparlqdgcwzoanpqqeof.supabase.co wss://rparlqdgcwzoanpqqeof.supabase.co https://brasilapi.com.br https://viacep.com.br; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>SERF - Redefinir Senha</title>
    <!-- Fonte moderna de alta tecnologia -->
    <link rel="icon" href="../../assets/icons/fivecon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/redefinir-senha.css">
    <!-- A CSP bloqueia o atributo de estilo inline: estilo calculado vai em data-css (ver o script) -->
    <script src="../../js/ui/estilos-dinamicos.js"></script>
</head>
<body>
    <div class="card-redefinir">
        <h2>Nova Senha</h2>
        <p>Crie uma senha com 8 ou mais caracteres, misturando letras e números.</p>

        <form id="formRedefinir">
            <div class="input-grupo">
                <label for="novaSenha">Nova Senha</label>
                <input type="password" id="novaSenha" placeholder="Digite sua nova senha" required minlength="8" maxlength="72" autocomplete="new-password">
            </div>
            <div class="input-grupo">
                <label for="confirmaNovaSenha">Confirmar Nova Senha</label>
                <input type="password" id="confirmaNovaSenha" placeholder="Confirme a senha" required minlength="8" maxlength="72" autocomplete="new-password">
            </div>
            <p class="mensagem-erro" id="erroRedefinir" role="alert" hidden></p>
            <button type="submit" class="btn-salvar">Atualizar Senha</button>
        </form>
    </div>

    <!-- SDK do Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
    <script src="../../js/supabase-client.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/redefinir-senha.js"></script>
</body>
</html>
