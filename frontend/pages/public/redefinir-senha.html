<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Política de segurança (CSP): ver frontend/_headers e docs/seguranca.md -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://rparlqdgcwzoanpqqeof.supabase.co; connect-src 'self' https://rparlqdgcwzoanpqqeof.supabase.co wss://rparlqdgcwzoanpqqeof.supabase.co https://brasilapi.com.br https://viacep.com.br; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>SERF - Redefinir Senha</title>
    <!-- Fonte moderna de alta tecnologia -->
    <link rel="icon" href="../../assets/icons/fivecon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #001f3f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .card-redefinir {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .card-redefinir h2 {
            color: #003366;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .card-redefinir p {
            font-size: 14px;
            color: #666666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .input-grupo {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-grupo label {
            font-size: 12px;
            font-weight: 600;
            color: #003366;
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .card-redefinir input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .card-redefinir input:focus {
            border-color: #F47A20;
        }

        .btn-salvar {
            width: 100%;
            padding: 14px;
            background-color: #B4570B;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .mensagem-erro {
            margin: 4px 0 8px;
            color: #b91c1c;
            font-size: 14px;
            text-align: left;
        }

        .mensagem-erro[hidden] {
            display: none;
        }

        .btn-salvar:hover {
            background-color: #ff8c00;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="card-redefinir">
        <h2>Nova Senha</h2>
        <p>Crie uma senha com 8 ou mais caracteres, misturando letras e números.</p>

        <form id="formRedefinir">
            <div class="input-grupo">
                <label for="novaSenha">Nova Senha</label>
                <input type="password" id="novaSenha" placeholder="Digite sua nova senha" required minlength="8" maxlength="72" autocomplete="new-password">
            </div>
            <div class="input-grupo">
                <label for="confirmaNovaSenha">Confirmar Nova Senha</label>
                <input type="password" id="confirmaNovaSenha" placeholder="Confirme a senha" required minlength="8" maxlength="72" autocomplete="new-password">
            </div>
            <p class="mensagem-erro" id="erroRedefinir" role="alert" hidden></p>
            <button type="submit" class="btn-salvar">Atualizar Senha</button>
        </form>
    </div>

    <!-- SDK do Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
    <script src="../../js/supabase-client.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/redefinir-senha.js"></script>
</body>
</html>
