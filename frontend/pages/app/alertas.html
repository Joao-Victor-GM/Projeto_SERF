<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Política de segurança (CSP): ver frontend/_headers e docs/seguranca.md -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://rparlqdgcwzoanpqqeof.supabase.co; connect-src 'self' https://rparlqdgcwzoanpqqeof.supabase.co wss://rparlqdgcwzoanpqqeof.supabase.co https://brasilapi.com.br https://viacep.com.br; object-src 'none'; base-uri 'self'; form-action 'self'">

    <title>S.E.R.F. | Alertas</title>

    <!-- Identidade visual e estilos compartilhados -->
    <link rel="icon" href="../../assets/icons/fivecon.png">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/home.css">
    <link rel="stylesheet" href="../../css/relatorios.css">
    <link rel="stylesheet" href="../../css/alertas.css">
    <link rel="stylesheet" href="../../css/notificacoes.css">
    <link rel="stylesheet" href="../../css/tema-escuro.css">
    <!-- Tema claro/escuro aplicado antes da pintura -->
    <script src="../../js/tema.js"></script>
    <!-- Proteção de rota: exige sessão ativa no Supabase Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
    <script src="../../js/supabase-client.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/auth-check.js"></script>
</head>

<body class="serf-home">

    <!-- =====================================================
         BLOCO 01 — MENU LATERAL
    ====================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-brand">
            <img
                src="../../assets/icons/fivecon.png"
                alt="Logo SERF"
                class="sidebar-logo"
            >

            <div class="brand-info">
                <strong>S.E.R.F.</strong>
                <span>Gestão B2B</span>
            </div>
        </div>

        <div class="sidebar-section-label">
            MENU PRINCIPAL
        </div>

        <nav class="sidebar-nav" aria-label="Menu principal" data-pagina-atual="alertas"></nav>
        <!-- Menu único de todas as páginas internas (js/ui/layout.js) -->
        <script src="../../js/ui/layout.js"></script>

        <div class="sidebar-footer">
            <span>S.E.R.F. • 2026</span>
            <small>Projeto Aplicado II / ACEx</small>
        </div>

    </aside>


    <!-- =====================================================
         BLOCO 02 — ESTRUTURA PRINCIPAL
    ====================================================== -->

    <div class="app-layout">

        <header class="topbar">

            <div class="topbar-left">
                <button
                    type="button"
                    class="menu-toggle"
                    id="menuToggle"
                    aria-label="Abrir ou fechar menu"
                    aria-controls="sidebar"
                    aria-expanded="false"
                >
                    ☰
                </button>
            </div>

            <div class="topbar-right">

                <div class="empresa-ativa">
                    <small>Empresa ativa</small>
                    <strong id="empresaAtiva">Carregando...</strong>
                </div>

                <!-- Alternar modo claro/escuro (tratado pelo tema.js) -->
                <button
                    type="button"
                    class="icon-button btn-tema"
                    data-alternar-tema
                    aria-pressed="false"
                    aria-label="Ativar modo escuro"
                    title="Modo escuro"
                >
                    <span class="tema-icone-escuro" aria-hidden="true">☾</span>
                    <span class="tema-icone-claro" aria-hidden="true">☀</span>
                </button>

                <!-- Perfil: acesso único pelo canto superior direito -->
                <a
                    href="perfil.html"
                    class="profile-button"
                    aria-label="Meu perfil"
                    title="Meu perfil"
                >
                    <span class="profile-avatar">E</span>
                </a>

                <!-- Logout padronizado (tratado pelo auth-check.js) -->
                <button
                    type="button"
                    class="btn-logout"
                    data-logout
                    title="Sair da conta"
                >
                    Sair
                </button>

            </div>
        </header>


        <!-- =====================================================
             ALERTAS (preenchidos pelo alertas.js a partir da view
             "alertas" — migration 015)
        ====================================================== -->

        <main class="main-content alertas-main" id="visao-alertas">

            <div class="page-heading">
                <div>
                    <span class="page-eyebrow">CENTRAL DE PENDÊNCIAS</span>
                    <h1>Alertas</h1>
                    <p>O que precisa da sua ação nos pedidos, pagamentos e estoque. Cada alerta some sozinho quando é resolvido.</p>
                </div>

                <div class="alertas-atualizacao">
                    <small id="alertasAtualizado"></small>
                    <button type="button" class="btn-secondary" id="btnAtualizarAlertas">
                        Atualizar
                    </button>
                </div>
            </div>

            <div class="rel-filtros" role="group" aria-label="Filtros dos alertas">
                <div class="rel-filtro" id="filtroPapelGrupo" hidden>
                    <span class="rel-filtro-rotulo">Mostrar</span>
                    <div class="rel-segmentado" id="filtroPapelAlertas">
                        <button type="button" class="rel-segmento active" data-papel="todos" aria-pressed="true">Tudo</button>
                        <button type="button" class="rel-segmento" data-papel="fornecedor" aria-pressed="false">Vendas</button>
                        <button type="button" class="rel-segmento" data-papel="comprador" aria-pressed="false">Compras</button>
                    </div>
                </div>
            </div>

            <!-- Totais por severidade (clique para filtrar) -->
            <div class="alertas-resumo" id="alertasResumo" aria-label="Totais por severidade"></div>

            <div class="alertas-lista" id="alertasLista" aria-live="polite"></div>

        </main>
    </div>

    <!-- Camada de dados (alertas) usada pelo contador do menu -->
    <script src="../../js/dados/base.js" defer></script>
    <script src="../../js/dados/pendencias.repositorio.js" defer></script>
    <script src="../../js/alertas-contagem.js" defer></script>
    <script src="../../js/dominio/notificacoes.js" defer></script>
    <script src="../../js/dados/notificacoes.repositorio.js" defer></script>
    <script src="../../js/notificacoes.js" defer></script>
    <script src="../../js/dominio/alertas.js" defer></script>
    <script src="../../js/alertas.js" defer></script>

</body>
</html>
